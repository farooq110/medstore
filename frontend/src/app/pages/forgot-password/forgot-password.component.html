<ion-content [fullscreen]="true" scrollY="false" class="forgot-password-content">
  <div class="forgot-password-wrapper">
    <ion-card class="forgot-password-card">
      <!-- Header Section with Logo -->
      <div class="header-section">
        <!-- Logo -->
        <div class="logo-container">
          <ion-img src="assets/icon-only.png" alt="Invoice Desk Logo" class="logo-image"></ion-img>
        </div>
        <h2 class="header-title">Recover Your Password</h2>
        <p class="header-subtitle">
          Enter your registered email address and we'll send you a link to reset your password.
        </p>
      </div>

      <!-- Form Section -->
      <ion-card-content class="form-section">
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
          <!-- Email Input -->
          <app-basic-input
            label="Email Address"
            placeholder="Enter your registered email"
            [formC]="forgotPasswordForm.get('email')"
            errorLabel="Email"
          ></app-basic-input>

          <!-- Submit Button -->
          <ion-button
            type="submit"
            expand="block"
            color="primary"
            class="submit-button"
            [disabled]="forgotPasswordForm.invalid || isLoading()"
          >
            @if (isLoading()) {
              <ion-spinner></ion-spinner>
              <span>Sending Reset Link...</span>
            } @else {
              <span>Send Reset Link</span>
            }
          </ion-button>
        </form>

        <!-- Back to Login Link -->
        <div class="back-link-section">
          <ion-button
            type="button"
            fill="clear"
            color="primary"
            expand="block"
            (click)="goBack()"
            class="back-link"
          >
            Back to Login
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
