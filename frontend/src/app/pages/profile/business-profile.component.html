<form [formGroup]="businessForm" (ngSubmit)="onSubmit()" class="profile-form">
  <ion-card>
    <ion-card-content>
      <div class="form-header">
        <div>
          <h2 class="h2">Business Profile</h2>
          <p class="h3">This info appears on your invoices and shared links.</p>
        </div>
        <div class="icon-container">
          <ion-icon name="build-outline"></ion-icon>
        </div>
      </div>

      <!-- Logo Upload Section -->
      <div class="logo-section">
        <div class="logo-label">Business Logo</div>
        <div class="logo-preview-container">
          @if (logoPreview) {
            <div class="logo-preview-wrapper">
              <img [src]="logoPreview" class="logo-preview" alt="Business Logo" />
              <button type="button" class="logo-remove-btn" (click)="removeLogo()">
                <ion-icon name="trash-outline"></ion-icon>
              </button>
            </div>
          } @else {
            <div class="logo-placeholder" (click)="triggerFileInput()">
              <ion-icon name="cloud-upload-outline" class="upload-icon"></ion-icon>
              <span class="upload-text">Tap to upload logo</span>
            </div>
          }
          <ion-button type="button" fill="outline" size="small" class="upload-btn" (click)="triggerFileInput()">
            <ion-icon name="camera-outline" slot="start"></ion-icon>
            Upload Image
          </ion-button>
        </div>
        <div class="logo-url-section">
          <span class="logo-url-label">or paste image URL:</span>
          <app-basic-input
            label="Logo URL"
            type="url"
            placeholder="https://example.com/logo.png"
            [formC]="businessForm.get('logoUrl')"
            errorLabel="Logo URL"
          ></app-basic-input>
        </div>
      </div>

      <app-basic-input
        label="Business Name"
        placeholder="Enter business name"
        [formC]="businessForm.get('name')"
        errorLabel="Business Name"
      ></app-basic-input>

      <app-basic-input
        label="Phone Number"
        placeholder="Enter phone number"
        [formC]="businessForm.get('phone')"
        errorLabel="Phone"
      ></app-basic-input>

      <app-basic-input
        label="Website"
        type="url"
        placeholder="https://example.com"
        [formC]="businessForm.get('website')"
        errorLabel="Website"
      ></app-basic-input>

      <app-basic-input
        label="Country / Region"
        placeholder="Enter country"
        [formC]="businessForm.get('country')"
        errorLabel="Country"
      ></app-basic-input>

      <app-basic-input
        label="Business Address"
        placeholder="Enter address"
        [formC]="businessForm.get('address')"
        errorLabel="Address"
      ></app-basic-input>

      <app-basic-input
        label="Company NTN"
        placeholder="Enter NTN number (optional)"
        [formC]="businessForm.get('ntn')"
        errorLabel="NTN"
      ></app-basic-input>

      <div class="form-actions">
        <app-custom-button
          label="Update Business"
          fill="solid"
          loadingLabel="Saving..."
          color="primary"
          [loading]="loading()"
          [disabled]="!businessForm.valid || !hasChanges() || loading()"
          (click)="onSubmit()"
        ></app-custom-button>
        <app-custom-button
          label="Cancel"
          color="medium"
          [disabled]="!hasChanges()"
          (click)="resetForm()"
        ></app-custom-button>
      </div>
    </ion-card-content>
  </ion-card>
</form>
